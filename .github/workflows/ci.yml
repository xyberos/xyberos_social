name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: social+
          POSTGRES_USER: social+
          POSTGRES_PASSWORD: social+
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U social+ -d social+"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://social+:social+@localhost:5432/social+
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Create scratch database for the migration rehearsal
        run: PGPASSWORD=social+ psql -h localhost -U social+ -d postgres -c 'CREATE DATABASE "social+_test"'
      - run: alembic -c backend/alembic.ini upgrade head
      - run: ruff check backend
      - run: pytest backend/tests -q
        env:
          SOCIAL_PLUS_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://social+:social+@localhost:5432/social+_test
