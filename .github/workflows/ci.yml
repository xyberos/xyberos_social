name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: soccom
          POSTGRES_USER: soccom
          POSTGRES_PASSWORD: soccom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soccom -d soccom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://soccom:soccom@localhost:5432/soccom
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: ruff check backend
      - run: pytest backend/tests -q
