services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: soccom
      POSTGRES_USER: soccom
      POSTGRES_PASSWORD: soccom
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soccom -d soccom"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
